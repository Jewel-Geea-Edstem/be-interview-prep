server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

spring:
  application:
    name: be-interview-prep
  datasource:
    url: ${DB_URL:jdbc:h2:mem:prep;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  data:
    web:
      pageable:
        max-page-size: 100

springdoc:
  swagger-ui:
    persist-authorization: true
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

app:
  short-url:
    base-url: ${SHORT_URL_BASE:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET}
    ttl: ${JWT_TTL:15m}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
